<script id="tlz-reveal-js">
(function(){
  var nodes=[].slice.call(document.querySelectorAll(".tlz-page .tlz-reveal:not(.tlz-in)"));
  if(!nodes.length)return;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var show=function(n){n.classList.add("tlz-in")};
  if(reduce||!("IntersectionObserver" in window)){nodes.forEach(show);return}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){show(e.target);io.unobserve(e.target)}});
  },{rootMargin:"0px 0px -12% 0px",threshold:.08});
  nodes.forEach(function(n){io.observe(n)});
  setTimeout(function(){nodes.forEach(show)},2600);
})();
</script>
