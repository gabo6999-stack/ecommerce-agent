<canvas id="c"></canvas>
<style>html,body{margin:0;background:#060c0a}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js",
            "three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 820, H = 1180;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;

renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const bgCan = document.createElement('canvas'); bgCan.width = 16; bgCan.height = 512;
const bgCtx = bgCan.getContext('2d');
const bgGrad = bgCtx.createLinearGradient(0, 0, 0, 512);
bgGrad.addColorStop(0, '#040a09'); bgGrad.addColorStop(.52, '#0d1d19');
bgGrad.addColorStop(.72, '#0a1613'); bgGrad.addColorStop(1, '#05100d');
bgCtx.fillStyle = bgGrad; bgCtx.fillRect(0, 0, 16, 512);
const bgTex = new THREE.CanvasTexture(bgCan);
bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;

// Entorno de estudio: sin esto el vidrio no tiene nada que reflejar y se ve muerto
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(20, W / H, 1, 1000);
camera.position.set(0, 43, 172);
camera.lookAt(0, 16.5, 0);

// ── Perfil del vial 2R: pared de 1.1 mm y fondo de 2.6 mm, torneado con lathe.
// Modelar la pared interior de verdad es lo que da refracción creíble; con un
// cilindro macizo el vidrio parece plástico.
const p = [];
const push = (x, y) => p.push(new THREE.Vector2(x, y));
push(0.01, 0); push(6.8, 0); push(7.4, 0.6);            // base exterior
push(7.5, 2); push(7.5, 26);                             // cuerpo
push(7.3, 28.2); push(5.6, 30.2); push(4.6, 31.4);       // hombro
push(4.6, 33.2); push(5.35, 33.6); push(5.35, 34.6);     // cuello y pestaña
push(4.25, 34.6);                                        // borde superior
push(4.25, 33.0); push(3.5, 31.2);                       // pared interior del cuello
push(5.0, 29.6); push(6.4, 27.6);
push(6.4, 2.6); push(0.01, 2.6);                         // fondo interior grueso
const glassGeo = new THREE.LatheGeometry(p, 192);
glassGeo.computeVertexNormals();
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.045,
  transmission: 1, thickness: 2.4, ior: 1.52,
  attenuationColor: new THREE.Color(0xcfe8dc), attenuationDistance: 42,
  clearcoat: 0.35, clearcoatRoughness: 0.06, envMapIntensity: 1.5,
});
scene.add(new THREE.Mesh(glassGeo, glass));

// ── Etiqueta: 43 mm sobre un perímetro de 47.7 mm, con el bloque de texto al frente
const tex = await new THREE.TextureLoader().loadAsync('label_hi.png');
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;
const RLAB = 7.56, LW = 43, arc = (2 * Math.PI * LW) / (2 * Math.PI * RLAB);
const labGeo = new THREE.CylinderGeometry(RLAB, RLAB, 22, 256, 1, true, -0.25 * arc, arc);
const label = new THREE.Mesh(labGeo, new THREE.MeshStandardMaterial({
  map: tex, roughness: 0.78, metalness: 0, side: THREE.DoubleSide, envMapIntensity: 0.7,
}));
label.position.y = 16.0;
scene.add(label);

// ── Torta liofilizada
const cake = new THREE.Mesh(
  new THREE.CylinderGeometry(6.35, 6.35, 5.2, 96),
  new THREE.MeshStandardMaterial({ color: 0xf4f3ee, roughness: 0.96, metalness: 0 }));
cake.position.y = 2.6 + 2.6;
cake.visible = true; scene.add(cake);

// ── Tapón de bromobutilo
const stop = new THREE.Mesh(
  new THREE.CylinderGeometry(4.2, 4.2, 5.4, 64),
  new THREE.MeshStandardMaterial({ color: 0x35383d, roughness: 0.82, metalness: 0 }));
stop.position.y = 32.4;
stop.visible = true; scene.add(stop);

// ── Sello de aluminio engastado (20 mm), torneado con su perfil real:
// corona plana con hueco central, falda con estrías y rizo por debajo de la
// pestaña de vidrio. El disco plano anterior parecía tapa de frasco.
const RB = 3.05;          // radio del botón flip-off
const sealPts = [
  new THREE.Vector2(RB,        35.42),   // borde interior de la corona
  new THREE.Vector2(RB + 0.22, 35.58),   // labio alrededor del hueco
  new THREE.Vector2(5.42,      35.58),   // corona plana
  new THREE.Vector2(5.72,      35.40),   // canto redondeado
  new THREE.Vector2(5.80,      35.02),
  new THREE.Vector2(5.80,      31.90),   // falda
  new THREE.Vector2(5.62,      31.16),   // rizo bajo la pestaña
  new THREE.Vector2(5.10,      30.86),
  new THREE.Vector2(4.72,      30.96),
];
const sealGeo = new THREE.LatheGeometry(sealPts, 192);
sealGeo.computeVertexNormals();
const seal = new THREE.Mesh(sealGeo, new THREE.MeshStandardMaterial({
  color: 0xc9d0d4, metalness: 1, roughness: 0.26,
  side: THREE.DoubleSide, envMapIntensity: 1.35,
}));
scene.add(seal);

// Estrías del engaste: finas y solo en la falda, como las deja la crimpadora
const ridgeCan = document.createElement('canvas'); ridgeCan.width = 1024; ridgeCan.height = 4;
const rCtx = ridgeCan.getContext('2d');
for (let i = 0; i < 1024; i++) {
  const v = 150 + Math.round(105 * Math.pow(Math.abs(Math.sin(i * Math.PI / 11)), 0.6));
  rCtx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
  rCtx.fillRect(i, 0, 1, 4);
}
const ridgeTex = new THREE.CanvasTexture(ridgeCan);
ridgeTex.wrapS = ridgeTex.wrapT = THREE.RepeatWrapping;
const skirt = new THREE.Mesh(
  new THREE.CylinderGeometry(5.81, 5.81, 3.0, 192, 1, true),
  new THREE.MeshStandardMaterial({
    color: 0xc4cbcf, metalness: 1, roughness: 0.3,
    roughnessMap: ridgeTex, envMapIntensity: 1.3, side: THREE.DoubleSide,
  }));
skirt.position.y = 33.4;
scene.add(skirt);

// ── Flip-off: botón abombado y estrecho, no un disco del ancho del sello
const flipPts = [
  new THREE.Vector2(0.01, 37.30),
  new THREE.Vector2(1.30, 37.26),
  new THREE.Vector2(2.20, 37.12),
  new THREE.Vector2(2.74, 36.86),
  new THREE.Vector2(3.00, 36.50),
  new THREE.Vector2(RB,   36.10),
  new THREE.Vector2(RB,   35.30),
  new THREE.Vector2(0.01, 35.30),
];
const flipGeo = new THREE.LatheGeometry(flipPts, 128);
flipGeo.computeVertexNormals();
const flip = new THREE.Mesh(flipGeo, new THREE.MeshStandardMaterial({
  color: 0xff047e, roughness: 0.34, metalness: 0.0,
  side: THREE.DoubleSide, envMapIntensity: 1.0,
}));
scene.add(flip);

// ── Suelo y luces
// Sin suelo: un plano iluminado por el entorno sale gris y parte la imagen.
// En su lugar, charco de sombra con alfa, que es como se monta un bodegón.
const shCan = document.createElement('canvas'); shCan.width = shCan.height = 256;
const shCtx = shCan.getContext('2d');
const shGrad = shCtx.createRadialGradient(128, 128, 4, 128, 128, 126);
shGrad.addColorStop(0, 'rgba(0,0,0,.92)'); shGrad.addColorStop(.35, 'rgba(0,0,0,.45)');
shGrad.addColorStop(.7, 'rgba(0,0,0,.12)'); shGrad.addColorStop(1, 'rgba(0,0,0,0)');
shCtx.fillStyle = shGrad; shCtx.fillRect(0, 0, 256, 256);
const shTex = new THREE.CanvasTexture(shCan);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(46, 30),
  new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.05; scene.add(shadow);

// Cartulina de rebote detrás del vial: sin ella el vidrio no transmite nada
// y el hombro sale negro con brillos de plástico.
const cardCan = document.createElement('canvas'); cardCan.width = cardCan.height = 256;
const cCtx = cardCan.getContext('2d');
const cGrad = cCtx.createRadialGradient(128, 96, 8, 128, 120, 132);
cGrad.addColorStop(0, 'rgba(96,168,150,.95)'); cGrad.addColorStop(.30, 'rgba(56,112,99,.72)');
cGrad.addColorStop(.62, 'rgba(28,62,54,.30)'); cGrad.addColorStop(1, 'rgba(10,21,18,0)');
cCtx.fillStyle = cGrad; cCtx.fillRect(0, 0, 256, 256);
const cardTex = new THREE.CanvasTexture(cardCan);
cardTex.colorSpace = THREE.SRGBColorSpace;
const card = new THREE.Mesh(new THREE.PlaneGeometry(46, 78),
  new THREE.MeshBasicMaterial({ map: cardTex, transparent: true, depthWrite: false }));
card.position.set(0, 20, -24); scene.add(card);

const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(-38, 52, 34);
scene.add(key);
const rim = new THREE.DirectionalLight(0xd8fff2, 1.9); rim.position.set(44, 26, -30); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(16, 10, 60); scene.add(fill);

renderer.render(scene, camera);
window.__listo = true;
</script>
